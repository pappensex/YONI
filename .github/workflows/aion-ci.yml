name: AION CI

on:
  push:
    paths:
      - 'aion-revenue-engine/**'
      - '.github/workflows/aion-ci.yml'
  pull_request:
    paths:
      - 'aion-revenue-engine/**'
      - '.github/workflows/aion-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aion-revenue-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aion-revenue-engine/requirements.txt
      - run: pip install -e '.[dev]'
      - run: pytest -q
